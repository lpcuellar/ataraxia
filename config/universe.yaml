# Universo de candidatos de Ataraxia — embudo de dos etapas (ver BUILD_PLAN.md)
#
# Etapa 1 (filtro cuantitativo, sin juicio humano): se genera programáticamente aplicando
# cortes objetivos sobre las acciones listadas en EE.UU. No se edita a mano este archivo
# para "elegir favoritos" — el pool completo se regenera por código en src/data/.
#
# Etapa 2 (lote rotativo): cada semana se selecciona un subconjunto del pool para research
# profundo. El estado de qué se ha revisado y cuándo vive en la base de datos, no aquí.
#
# DECISIÓN 2026-10-11 (LP): la pertenencia al S&P 500 deja de ser criterio de elegibilidad.
# Buscar alpha contra el S&P 500 eligiendo solo dentro del S&P 500 obliga a que el alpha
# venga de ponderación y timing, nunca de selección — contradice la misión del proyecto.
# El piso baja de $10B a $1B para que entre el mediano, que es donde un screen de calidad
# tiene más chance de encontrar un negocio no descontado.

filtros_cuantitativos:
  market_cap_minimo_usd: 1000000000    # $1B (mil millones) — entra mid y small-mid cap
  cobertura_analistas_minima: 3        # bajado de 5: exigir 5 sesga a nombres ya seguidos
  requiere_pertenencia_indice: false   # reemplaza indice_base — ya no se filtra por índice
  solo_listadas_en_eeuu: true          # sin ADRs internacionales por ahora (decisión abierta)

lote_rotativo:
  tickers_nuevos_por_semana: 8         # bajado de 18: el ciclo de lun/mié moría por timeout
  revision_diaria_de_holdings_actuales: true   # siempre, independiente del lote rotativo

# Placeholder — se genera y actualiza por código, no manualmente:
pool_filtrado: []
